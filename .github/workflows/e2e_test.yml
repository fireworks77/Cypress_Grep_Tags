name: E2E Test

on:
  pull_request:
    branches:
      - main
  

env:
  COMMIT_NUMBER: ${{ github.sha }}
  PR_NUMBER: ${{ github.event.number }}      

jobs:
  run_e2e_tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout Codes
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18 

      - name: Download Logs From Artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-${{ env.COMMIT_NUMBER }}
          path: ./.github/scripts/
        continue-on-error: true

      - name: Prepare E2E Test Specs
        id: prepare_e2e_test_specs
        shell: bash
        run: |
          cd ./.github/scripts/
          chmod 777 ./prepare_e2e_test_specs
          ./prepare_e2e_test_specs
          echo "specs=$(cat ./e2e_test_specs.log)" >> $GITHUB_OUTPUT

      - name: Run E2E Tests
        id: run_e2e_tests
        uses: cypress-io/github-action@v6
        with:
          install-command: npm install
          command: npm run cypress:specs ${{ steps.prepare_e2e_test_specs.outputs.specs}}
        continue-on-error: true

      - name: Upload Failed Test Spec Logs To Artifacts
        id: upload_e2e_failed_tests_log
        if: steps.run_e2e_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-${{ env.COMMIT_NUMBER }}
          path: ./cypress/logs/failed_test_specs.log

      - name: Return Failure Test Status
        if: steps.run_e2e_tests.outcome != 'success'
        run: |
          exit 1
          


